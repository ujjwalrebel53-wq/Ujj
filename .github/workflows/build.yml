name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix package name
        run: |
          sed -i 's/com.spinplay99.app/com.spinplay99.adminpanel/g' app/build.gradle
          sed -i 's/com.spinplay99.app/com.spinplay99.adminpanel/g' app/src/main/AndroidManifest.xml
          find app/src -name "*.java" -exec sed -i 's/com.spinplay99.app/com.spinplay99.adminpanel/g' {} \;

      - name: Grant Gradle permission
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpinPlay99-debug
          path: app/build/outputs/apk/debug/app-debug.apk
